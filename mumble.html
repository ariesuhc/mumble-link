<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Connexion au Serveur Mumble</title>
</head>
<body>
	<p>Redirection vers Mumble en cours... Autorisez le navigateur à ouvrir Mumble.</p>
	<p>Si rien ne se passe, <a id="mumble-link" href="#">cliquez ici</a>.</p>

	<script>
		const urlParams = new URLSearchParams(window.location.search);
		const pseudo = urlParams.get('pseudo') || 'Joueur';
		const mumbleUrl = "mumble://" + pseudo + "@game-1.lifeheberg.com:20060";
		
		document.getElementById("mumble-link").href = mumbleUrl;
		window.location.href = mumbleUrl;
	</script>
</body>
</html>
